#
# Model 2 NX - MAME settings for the Nintendo Switch
#
# Installed to sdmc:/switch/model2nx/mame.ini on first launch and never
# overwritten afterwards: edit it there. Delete it to get these defaults back.
# Paths are relative to sdmc:/switch/model2nx/.
#

#
# Folders
#
rompath                   roms
cfg_directory             cfg
nvram_directory           nvram
snapshot_directory        snap
diff_directory            diff
state_directory           sta

#
# Video: MAME's SDL2 renderer ("accel"), full screen, 4:3 kept
#
video                     accel
window                    0
maximize                  1
keepaspect                1
waitvsync                 0

#
# Speed: skip frames automatically when the console falls behind
#
autoframeskip             1

#
# Sound
#
sound                     sdl
samplerate                48000

#
# Input: Joy-Cons and Pro Controller through SDL
#
joystick                  1
# SDL on the Switch never reports window focus, and MAME ignores input
# without it unless this is on
background_input          1

#
# Recompilers (SHARC on Model 2B, TGPx4 on Model 2C): C back end until the
# ARM64 back end runs on libnx's JIT memory (docs/roadmap.md)
#
drc_use_c                 1
drc_rwx                   0

#
# Front end
#
plugins                   0
cheat                     0
skip_gameinfo             1
confirm_quit              0
