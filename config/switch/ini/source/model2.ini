#
# Model 2 NX - settings for every Model 2 game (MAME driver model2.cpp)
#
# Copy to sdmc:/switch/model2nx/ini/source/model2.ini
#
# In the games, the screen is one texture the GPU scales, so the SDL2
# renderer ("accel") is cheaper than composing each frame on the CPU.
# MAME's menus keep "soft" from mame.ini.
#
video                     accel
